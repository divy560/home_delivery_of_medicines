<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
  body{font-family:Segoe UI;background:#eef3ff;display:flex;justify-content:center;align-items:center;height:100vh;}
  .box{background:white;padding:25px;border-radius:10px;width:330px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
  input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccd7ff;border-radius:8px;}
  .btn{background:#2b8cff;color:white;padding:10px;border:0;width:100%;border-radius:8px;}
</style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn">Login</button>
  </form>

  <p style="margin-top:10px;text-align:center;">
    No account? <a href="{{ url_for('auth.register') }}">Register</a>
  </p>
</div>

</body>
</html>
