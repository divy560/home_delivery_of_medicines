<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .card { background: #fff; border-radius: 16px; padding: 48px 40px; max-width: 400px; border: 1px solid #e8eaf0; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #c62828; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        a { display: inline-block; padding: 10px 24px; background: #1a1a2e; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚫</div>
        <h1>Access Denied</h1>
        <p>You don't have permission to view the admin panel. This area is restricted to admins only.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
