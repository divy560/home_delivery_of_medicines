<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login — MediDelivery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrap { width: 100%; max-width: 400px; padding: 20px; }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-size: 26px; color: #1a1a2e; font-weight: 700; }
        .logo h1 span { color: #1565c0; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        .card { background: #fff; border-radius: 16px; padding: 32px; border: 1px solid #e8eaf0; }
        .lock-icon { text-align: center; font-size: 40px; margin-bottom: 20px; }
        h2 { font-size: 20px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px; text-align: center; }
        .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border 0.15s; }
        input:focus { outline: none; border-color: #1565c0; }
        .btn { width: 100%; padding: 12px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
        .btn:hover { background: #1565c0; }
        .error { background: #ffebee; color: #c62828; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center; }
        .back { text-align: center; margin-top: 20px; }
        .back a { color: #888; font-size: 13px; text-decoration: none; }
        .back a:hover { color: #1565c0; }
        .hint { background: #e3f2fd; color: #1565c0; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="logo">
            <h1>Medi<span>Admin</span></h1>
            <p>Home Delivery Medicine — Admin Panel</p>
        </div>
        <div class="card">
            <div class="lock-icon">🔐</div>
            <h2>Admin Sign In</h2>
            <p class="subtitle">Only authorized admins can access this panel.</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter admin username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Sign In to Admin Panel</button>
            </form>

            <div class="hint">
                💡 To create an admin account, run <strong>create_admin.py</strong>
            </div>
        </div>
        <div class="back">
            <a href="/">← Back to main site</a>
        </div>
    </div>
</body>
</html>
