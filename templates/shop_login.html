<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop Login</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef4ff, #dbeafe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* LOGIN CARD */
.container {
    background: white;
    padding: 30px;
    width: 320px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    text-align: center;
    animation: fadeIn 0.6s ease;
}

h2 {
    margin-bottom: 20px;
    color: #1e63f3;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #1e63f3;
    box-shadow: 0 0 5px rgba(30, 99, 243, 0.3);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #1e63f3;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #174ed1;
    transform: translateY(-2px);
}

/* FLASH MESSAGE */
.flash {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
}

.flash.success {
    background: #e6f9f0;
    color: #2e7d32;
    border: 1px solid #2e7d32;
}

.flash.error {
    background: #fdecea;
    color: #c62828;
    border: 1px solid #c62828;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

    <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h2>🔐 Shop Login</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
