<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Login — MediDelivery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #e3f2fd 0%, #f0f4ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .wrap { width: 100%; max-width: 400px; padding: 20px; }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 26px; color: #1a1a2e; font-weight: 700; }
        .logo h1 span { color: #1565c0; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }
        .card { background: #fff; border-radius: 16px; padding: 32px; border: 1px solid #e0e7ff; box-shadow: 0 4px 24px rgba(21,101,192,0.07); }
        .icon { text-align: center; font-size: 44px; margin-bottom: 12px; }
        h2 { font-size: 20px; font-weight: 600; text-align: center; color: #1a1a2e; margin-bottom: 4px; }
        .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 5px; }
        input { width: 100%; padding: 11px 13px; border: 1px solid #dde3f0; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border 0.15s; }
        input:focus { outline: none; border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.08); }
        .btn { width: 100%; padding: 13px; background: #1565c0; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
        .btn:hover { background: #0d47a1; }
        .error { background: #ffebee; color: #c62828; padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border-left: 4px solid #c62828; }
        .links { text-align: center; margin-top: 18px; font-size: 13px; color: #888; }
        .links a { color: #1565c0; text-decoration: none; font-weight: 500; }
        .note { background: #e3f2fd; color: #1565c0; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo">
        <h1>💊 Medi<span>Delivery</span></h1>
        <p>Shop Partner Portal</p>
    </div>

    <div class="card">
        <div class="icon">🏪</div>
        <h2>Shop Login</h2>
        <p class="sub">Access your shop dashboard and manage orders.</p>

        {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" name="email" placeholder="shop@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>

        <div class="note">⏳ New shops need admin approval before they can login.</div>
    </div>

    <div class="links">
        New shop? <a href="{{ url_for('shop.shop_register') }}">Register here</a> &nbsp;|&nbsp;
        <a href="/">Back to site</a>
    </div>
</div>
</body>
</html>
